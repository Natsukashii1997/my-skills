<title>精密暗色 参考页</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;300;400;500;700;900&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* 切换栏跟随查看者主题；10 种风格各自是固定的单一视觉世界，颜色全部写死 */
:root{--ui-bg:#F5F5F3;--ui-fg:#1A1A1C;--ui-mut:#5E5E64;--ui-line:#D9D9D5;--ui-on:#1A1A1C;--ui-onfg:#FFFFFF;--ui-font:'Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ui-bg:#17171A;--ui-fg:#EDEDEF;--ui-mut:#A2A2A8;--ui-line:#303035;--ui-on:#EDEDEF;--ui-onfg:#17171A;color-scheme:dark}}
:root[data-theme="dark"]{--ui-bg:#17171A;--ui-fg:#EDEDEF;--ui-mut:#A2A2A8;--ui-line:#303035;--ui-on:#EDEDEF;--ui-onfg:#17171A;color-scheme:dark}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ui-bg);color:var(--ui-fg);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ui-bg)}
.sw{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ui-bg);border-bottom:1px solid var(--ui-line);font-family:var(--ui-font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sw-in{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 20px;padding-block:10px}
.sw-n{display:flex;flex-wrap:wrap;gap:4px}
.sw button{font:inherit;font-size:13px;line-height:1;height:32px;padding:0 10px;border:1px solid var(--ui-line);background:transparent;color:var(--ui-fg);border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sw-n button span{font-size:11px;color:var(--ui-mut);font-variant-numeric:tabular-nums}
.sw button[aria-pressed="true"]{background:var(--ui-on);color:var(--ui-onfg);border-color:var(--ui-on)}
.sw-n button[aria-pressed="true"] span{color:var(--ui-onfg);opacity:.7}
.sw button:focus-visible{outline:2px solid var(--ui-fg);outline-offset:2px}
.sw-p{display:flex;gap:0;grid-column:2;grid-row:1;align-self:start}
.sw-in>div:not([class]){display:none}
.sw-p button{border-radius:0}.sw-p button:first-child{border-radius:6px 0 0 6px}.sw-p button:last-child{border-radius:0 6px 6px 0;margin-left:-1px}
.sw-d{grid-column:1/-1;font-size:13px;line-height:1.5;color:var(--ui-mut);min-width:0}
.sw-d b{color:var(--ui-fg);font-weight:700;margin-right:10px}

/* ---------- 共用结构（各风格在其上覆盖） ---------- */
.st{background:var(--bg);color:var(--fg);font-family:var(--f-b);font-size:16px;line-height:1.7;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:clip}
.st *{box-sizing:border-box}
.st h1,.st h2,.st h3,.st h4,.st h5,.st p,.st ol,.st ul,.st dl,.st dd,.st dt,.st figure,.st blockquote{margin:0;padding:0}
.st ol,.st ul{list-style:none}
.st button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
.st img{display:block;max-width:100%}
.st a{color:inherit}
.st i{font-style:normal}
.st mark{background:none;color:inherit}
.st :focus-visible{outline:2px solid var(--c,var(--fg));outline-offset:3px}
.st .s1{--c:var(--c1);--ct:var(--c1t);--cd:var(--c1d)}
.st .s2{--c:var(--c2);--ct:var(--c2t);--cd:var(--c2d)}
.st .s3{--c:var(--c3);--ct:var(--c3t);--cd:var(--c3d)}
.st .wrap{max-width:1240px;margin:0 auto;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}

/* home */
.st .hero{padding-block:64px 40px}
.st .hero-in{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px 64px;align-items:end}
.st .h-deco{display:none}
.st .h-main{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:18px;min-width:0}
.st .h-title{font-family:var(--f-d);text-wrap:balance}
.st .h-title>span{display:block}
.st .h-quote{grid-column:2;grid-row:1;min-width:0}
.st .h-quote figcaption{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.st .h-facts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px 40px}
.st .h-facts div{display:flex;gap:12px;align-items:baseline}
.st .spine-sec{padding-block:16px 96px}
.st .sp-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px;margin-bottom:24px}
.st .spine{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.st .sp{display:flex;flex-direction:column;gap:14px;min-width:0}
.st .sp-top{display:flex;align-items:baseline;gap:12px}
.st .sp-row{display:flex;flex-direction:column;gap:8px}
.st .sp-chips{display:flex;flex-wrap:wrap;gap:6px}
.st .sp-out{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center}
.st .sp-out img{width:72px;height:50px;object-fit:cover;object-position:top}
.st .sp-out .d{display:block;font-size:12px;opacity:.75}
.st .sp-go{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left}

/* content */
.st .ch{padding-block:56px 112px}
.st .ch-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px 36px;align-items:end;margin-bottom:64px}
.st .ch-hd{display:flex;flex-direction:column;gap:10px;min-width:0}
.st .ch-title{font-family:var(--f-d);text-wrap:balance}
.st .ch-toc{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.st .ch-toc button{display:inline-flex;gap:8px;align-items:baseline}
.st .blks{display:flex;flex-direction:column;gap:80px}
.st .bk-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px;margin-bottom:28px}
.st .goal-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:stretch}
.st .goal{display:flex;flex-direction:column;gap:10px}
.st .g-row{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;align-items:baseline}
.st .g-to{display:flex;gap:8px;align-items:center;padding-left:70px}
.st .flow3{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch}
.st .f3{display:flex;flex-direction:column;gap:4px;min-width:0}
.st .f3a{align-self:center}
.st .method{display:flex;flex-direction:column}
.st .m-row{display:grid;grid-template-columns:200px minmax(0,1fr);gap:36px;padding-block:28px}
.st .m-lab{display:flex;flex-direction:column;gap:2px}
.st .m-body{min-width:0}
.st .jdg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.st .jd{display:flex;flex-direction:column;gap:8px;min-width:0}
.st .jd p b,.st .jd p span{display:block}
.st .dec-h,.st .dec-r{display:grid;grid-template-columns:minmax(0,1fr) 24px minmax(0,1.7fr) 150px;gap:14px;align-items:start}
.st .dec-r>div{min-width:0}
.st .seg-tag{white-space:nowrap}
.st .nb{display:inline-block}
.st .fx{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.st .fx-miss{margin-top:16px}
.st .rv{min-width:0}
.st .rv-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.st .rv-file{display:flex;align-items:center;gap:10px;min-width:0}
.st .copy{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.st .copy svg{width:15px;height:15px}
.st .rv-cols,.st .seg{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px}
.st .seg-code{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.st .seg-note{display:flex;flex-direction:column;gap:6px;min-width:0}
.st .sn-k{font-weight:700}
.st .demo{display:flex;flex-direction:column;gap:20px}
.st .dm-head{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap}
.st .dm-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.st .btn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.st .btn svg{width:11px;height:11px;fill:currentColor}
.st .dm-prog{font-size:13px;min-width:160px}
.st .d2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.st .win{min-width:0;display:flex;flex-direction:column}
.st .win-bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.st .wc,.st .tech,.st .sb{display:flex;flex-direction:column;gap:12px}
.st .wx{display:flex;flex-direction:column;gap:4px;align-items:flex-start;max-width:92%}
.st .wx.me{align-self:flex-end;align-items:flex-end}
.st .wx .t{font-size:12px}
.st .bub{display:inline-block}
.st .jump{text-align:center;font-size:12px}
.st .tc-h{display:flex;align-items:center;gap:8px;font-weight:700}
.st .tc-b{font-size:14px}
.st .code{font-family:var(--f-m);font-size:12.5px;line-height:1.65;margin-top:6px;overflow-wrap:anywhere}
.st .sb-cust{display:flex;gap:10px;align-items:center}
.st .sb-cust small{display:block;font-size:12px}
.st .av{display:grid;place-items:center;width:34px;height:34px;flex:none}
.st .todo{display:flex;flex-direction:column;gap:6px}
.st .todo h5{font-size:15px;line-height:1.45}
.st .todo .q,.st .todo .meta{font-size:13px}
.st .acts{display:flex;flex-wrap:wrap;gap:6px}
.st .acts span{font-size:13px;padding:3px 10px}
.st .p0,.st .p1{align-self:flex-start;font-family:var(--f-m);font-size:11px;font-weight:700;padding:1px 6px}
.st .wb{font-size:13px}
.st .steps6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:18px}
.st .steps6 li{display:flex;gap:8px;align-items:baseline;font-size:13px}
.st .steps6 span{font-family:var(--f-m);font-size:11px}
.st .off{display:none!important}
.st .enter{animation:dmIn .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes dmIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.st .tc{transition:opacity .3s}
.st .graph{display:flex;flex-direction:column;gap:14px}
.st .graph-h{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
.st .gx{display:grid;grid-template-columns:72px repeat(5,minmax(0,1fr));grid-template-rows:auto auto auto;gap:8px}
.st .gcol{display:grid;grid-template-rows:subgrid;grid-row:span 3;gap:8px;min-width:0}
.st .gcol>span{min-width:0}
.st .gh i{margin-right:6px}
.st .rep{display:grid;grid-template-columns:320px minmax(0,1fr);gap:40px;align-items:start}
.st .rc{display:flex;flex-direction:column;gap:16px;min-width:0}
.st .rc-img img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top}
.st .rc-body{display:flex;flex-direction:column;gap:10px}
.st .rc-meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:13px}
.st .toc{display:flex;flex-direction:column;gap:24px;min-width:0}
.st .toc-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.st .nums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.st .nums>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.st .nums b{font-family:var(--f-n,var(--f-d));line-height:1.1}
.st .nums .cap{font-size:12px;line-height:1.5;margin-top:4px}
.st .bar{height:6px;margin-top:6px}
.st .bar i{display:block;height:100%}
.st .tp{display:flex;flex-direction:column;gap:10px}
.st .tp-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 16px;flex-wrap:wrap}
.st .tp-h>div:first-child{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.st .tp-tags{display:flex;gap:6px;flex-wrap:wrap}
.st .tp li{display:grid;grid-template-columns:44px 150px minmax(0,1fr);gap:14px;align-items:baseline;padding-block:8px}
@media (prefers-reduced-motion: reduce){.st .enter{animation:none}.st .tc{transition:none}.st *{scroll-behavior:auto}}

/* ===== 22 精密暗色 ===== */
/* 布局：1200 居中容器，左对齐大标题 + 一块块“产品截图”窗口；近黑偏蓝底 + 四级表面阶梯，1px 半透明细线，12px 圆角，单一淡紫蓝强调 */
.st-22{--bg:#08090B;--s1:#0F1013;--s2:#141519;--s3:#1A1B20;--s4:#22232A;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
 --fg:#F4F5F6;--fg2:#D0D4DB;--mut:#8A8F98;--ter:#5E636B;--acc:#8790F5;--acct:rgba(135,144,245,.14);--ok:#4CB782;--warn:#E5A44B;--p0:#EB5D5D;
 --f-d:'Geist','Noto Sans SC',-apple-system,sans-serif;--f-b:'Geist','Noto Sans SC',-apple-system,sans-serif;--f-m:'Geist Mono','Noto Sans SC',monospace;
 font-size:15px;line-height:1.65;color-scheme:dark;color:var(--fg2)}
.st-22 .pd-mono{font-family:var(--f-m);font-size:12px;letter-spacing:0}
.st-22 .pd-in{max-width:1200px;margin:0 auto;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));padding-block:0 120px}
.st-22 .pd-hero{display:flex;flex-direction:column;align-items:flex-start;gap:22px;padding-block:96px 56px}
.st-22 .pd-badge{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--fg2);border:1px solid var(--line2);background:var(--s1);border-radius:999px;padding:4px 12px 4px 10px}
.st-22 .pd-badge i{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.st-22 .pd-h1{font-family:var(--f-d);font-size:76px;line-height:1.06;font-weight:600;letter-spacing:-.035em;color:var(--fg);text-wrap:balance;max-width:14em}
.st-22 .pd-h1 span{display:block}
.st-22 .pd-dim{color:var(--ter)}
.st-22 .pd-sub{font-size:19px;line-height:1.6;color:var(--mut);max-width:34em;letter-spacing:-.005em}
.st-22 .pd-sub b{color:var(--fg2);font-weight:500}
.st-22 .pd-cta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:6px}
.st-22 .pd-pri{height:40px;padding:0 18px;border-radius:8px;background:var(--acc);color:#0B0C1A!important;font-size:14px;font-weight:600}
.st-22 .pd-pri:hover{background:#9EA5FA}
.st-22 .pd-cta-n{font-size:13px;color:var(--mut)}
/* 窗口 */
.st-22 .pd-win{background:var(--s1);border:1px solid var(--line2);border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 30px 80px -40px rgba(0,0,0,.9)}
.st-22 .pd-wbar{display:flex;align-items:center;gap:12px;height:42px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--s2);font-size:13px}
.st-22 .pd-wbar b{color:var(--fg);font-weight:500;white-space:nowrap}
.st-22 .pd-wbar>span:not(.pd-dots){color:var(--mut);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-22 .pd-dots{display:flex;gap:6px}
.st-22 .pd-dots i{width:10px;height:10px;border-radius:50%;background:var(--s4)}
.st-22 .pd-hero-win{margin-bottom:8px}
.st-22 .pd-list{display:flex;flex-direction:column}
.st-22 .pd-lh,.st-22 .pd-li{display:grid;grid-template-columns:200px minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.3fr) 72px;gap:20px;align-items:center;padding:0 20px}
.st-22 .pd-lh{height:36px;font-size:12px;color:var(--ter);border-bottom:1px solid var(--line)}
.st-22 .pd-li{min-height:64px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;width:100%}
.st-22 button.pd-li{cursor:pointer;transition:background .15s}
.st-22 button.pd-li:hover{background:var(--s2)}
.st-22 .pd-li.is-on{background:var(--s2);box-shadow:inset 2px 0 0 var(--acc)}
.st-22 .pd-li-k{display:flex;align-items:center;gap:10px;color:var(--fg);font-weight:500}
.st-22 .pd-li-k em{font-family:var(--f-m);font-size:12px;color:var(--ter);font-weight:400}
.st-22 .pd-st{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ok);background:radial-gradient(circle,var(--ok) 0 3px,transparent 3.5px);flex:none}
.st-22 .pd-st.run{border-color:var(--acc);background:conic-gradient(var(--acc) 0 50%,transparent 50%);box-shadow:inset 0 0 0 2px var(--s2)}
.st-22 .pd-li-w{color:var(--fg2)}
.st-22 .pd-chips{display:flex;flex-wrap:wrap;gap:4px}
.st-22 .pd-chips i{font-size:12px;color:var(--fg2);border:1px solid var(--line2);border-radius:6px;padding:1px 7px;background:var(--s3)}
.st-22 .pd-li-o{color:var(--mut);font-size:13.5px}
.st-22 .pd-li-d{font-family:var(--f-m);font-size:12px;color:var(--mut);text-align:right}
.st-22 .pd-lf{padding:14px 20px;font-size:13px;color:var(--mut)}
.st-22 .pd-lf span{color:var(--ter);margin-left:8px}
/* 小节 */
.st-22 .pd-sec{padding-top:120px}
.st-22 .pd-sh{display:flex;flex-direction:column;gap:10px;margin-bottom:36px}
.st-22 .pd-sh p{max-width:44em}
.st-22 .pd-ey{font-size:13px;color:var(--acc);font-weight:500}
.st-22 .pd-sh h2{font-family:var(--f-d);font-size:44px;line-height:1.12;font-weight:600;letter-spacing:-.025em;color:var(--fg);text-wrap:balance}
.st-22 .pd-sh p{font-size:16px;color:var(--mut)}
.st-22 .pd-card{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:8px;min-width:0}
.st-22 .pd-card b{font-size:17px;line-height:1.45;font-weight:500;color:var(--fg);letter-spacing:-.01em}
.st-22 .pd-card p{font-size:14px;color:var(--mut)}
.st-22 .pd-cl{font-size:12.5px;color:var(--ter)}
.st-22 .pd-card.is-on{background:var(--s2);border-color:var(--line2)}
.st-22 .pd-card.is-on .pd-cl{color:var(--acc)}
.st-22 .pd-outs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.st-22 .pd-out{display:flex;flex-direction:column;gap:14px}
.st-22 .pd-shot{background:var(--s2);border:1px solid var(--line2);border-radius:12px;padding:8px;overflow:hidden}
.st-22 .pd-shot img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;border-radius:6px;opacity:.86}
.st-22 .pd-out.is-on .pd-shot img{opacity:1}
.st-22 .pd-out figcaption{display:flex;flex-direction:column;gap:2px;padding-inline:4px}
.st-22 .pd-out figcaption span{font-family:var(--f-m);font-size:12px;color:var(--ter)}
.st-22 .pd-out figcaption b{font-size:15px;font-weight:500;color:var(--fg)}
.st-22 .pd-quote{margin-top:120px;padding-top:40px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:40px;align-items:end}
.st-22 .pd-quote blockquote{font-size:30px;line-height:1.45;font-weight:500;letter-spacing:-.02em;color:var(--fg);text-wrap:balance}
.st-22 .pd-quote figcaption{display:flex;gap:12px;align-items:center}

<script type="text/plain" id="p2">我们已经和{{一线角色，例：销售}}做完访谈，访谈报告附在后面。现在要把业务人员的反馈翻译成技术语言，写一份技术方案，让大家清楚这些反馈具体对应到下一步开发的哪些工作。

这份报告要给{{汇报对象，例：管理层和技术团队}}看。我们的技术同事和各业务板块的架构师已经会用{{已掌握的工具，例：Hermes 等基础工具}}，基础概念都了解，现有的{{已有系统，例：销售看板}}也是围绕这些技术搭建的，所以可以直接用他们熟悉的概念来讲。

难点在于：技术功能和业务之间到底是什么关系，业务提出的需求又该怎么落成具体的功能页面，这件事很抽象。{{更抽象的原因，没有可删，例：加上要做的工作台还没开始开发，就更抽象了。}}

请用全局的视角，抓住两条线来分析。一条是业务流：业务人员谈到的每个场景和事件，背后对应哪个数据节点或哪些关键数据。另一条是数据流：一线要处理的每一个{{业务单元，例：待办}}可能由哪条数据产生，比如人在翻看{{过程数据，例：企微聊天记录}}时会记下的事项，技术侧能由哪类数据或哪种状态变化自动识别出来。请先把这两条线画成一张图谱，再基于图谱展开分析，分析中回答这几件事：

1. 业务背后最关键的对象有哪些，它们之间是什么关系、处在哪个环节、状态怎么变化，也就是数据本体；
2. 每一个{{业务单元}}：数据从哪里取（{{数据来源，例：会话归档、中台、排课系统、日历}}），事件怎么标记，推给谁，对方看到什么内容和上下文，怎样算完成，结果怎么写回本体；

      n.classList.toggle('off',!on);n.classList.toggle('enter',on&&fwd&&a===k);
    });
    $$('[data-hl]',root).forEach(function(n){var r=n.dataset.hl.split('-');n.classList.toggle('hl',k>=+r[0]&&k<=+r[1])});
    $$('[data-tc]',root).forEach(function(n){var a=+n.dataset.tc;n.classList.toggle('pend',k<a);n.classList.toggle('done',k>=a);n.classList.toggle('now',k===a);n.classList.toggle('enter',fwd&&k===a)});
    var c=cur(k),last=-1;AT.forEach(function(a,i){if(k>=a)last=i});
    steps.forEach(function(s){var i=+s.dataset.step;s.classList.toggle('now',i===c);s.classList.toggle('done',i<=last&&i!==c)});
    cols.forEach(function(w){w.classList.toggle('act',k>0&&k<TOTAL&&+w.dataset.col===col(k))});
  }
  function render(k,fwd){
    var my=++tok;if(go)go.classList.remove('press');
    if(fwd&&k===8&&go){paint(7,false);later(function(){if(my===tok)go.classList.add('press')},350);later(function(){if(my!==tok)return;go.classList.remove('press');paint(8,true)},900)}
    else paint(k,fwd);
  }
  function label(k){var c=cur(k);return k>=TOTAL?'完成 · 已写回':k===0?'就绪 · 共 6 步':(c>=0?'第 '+(c+1)+' / 6 步 · '+STEPS[c]:'聊天进行中')}
  function draw(fwd){render(st.k,!!fwd&&!RM);if(prog)prog.textContent=label(st.k);root.classList.toggle('is-done',st.k>=TOTAL)}
  function setPlay(p){st.playing=p;bLab.textContent=p?'暂停':'播放';var sv=$('svg',bPlay);if(sv)sv.innerHTML=p?'<path d="M2 1h3v10H2zM7 1h3v10H7z"/>':'<path d="M2 1l9 5-9 5z"/>';bPlay.classList.toggle('is-on',p)}
  function stop(){clearTimeout(st.timer);setPlay(false)}
  function delay(k){return k===8?2100:(k===1||k===4||k===7)?1900:1500}
  function tick(){if(st.k>=TOTAL){stop();return}st.k++;draw(true);if(st.k>=TOTAL){stop();return}st.timer=later(tick,delay(st.k))}
  function play(){if(st.k>=TOTAL){st.k=0;draw(false)}setPlay(true);clearTimeout(st.timer);st.timer=later(tick,st.k===0?600:250)}
  bPlay.addEventListener('click',function(){st.touched=true;st.playing?stop():play()});
  $('[data-act=replay]',root).addEventListener('click',function(){st.touched=true;stop();st.k=0;draw(false);play()});
  $('[data-act=step]',root).addEventListener('click',function(){st.touched=true;stop();if(st.k>=TOTAL){st.k=0;draw(false)}else{st.k++;draw(true)}});
  function lock(){
    if(!stage.offsetParent){return}
    stage.style.minHeight='';var h=0;
    for(var k=0;k<=TOTAL;k++){paint(k,false);h=Math.max(h,stage.offsetHeight)}
    draw(false);stage.style.minHeight=h+'px';
  }
  st.k=RM?TOTAL:0;draw(false);lock();CUR.lock=lock;
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(CUR.lock===lock)lock()});
  if(!RM&&'IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){
      if(e.isIntersecting){io.disconnect();if(!st.touched&&!st.playing&&st.k===0)play()}
    })},{threshold:.3});
    io.observe(stage);CUR.io=io;
  }
}

var S=22,T=TPL[S],app=$('#app'),pBtns=$$('.sw-p button');
function show(p){
  cleanup();app.className='st st-'+S+' pg-'+p;
  app.innerHTML=p==='ch'?T.ch():T.home();
  pBtns.forEach(function(b){b.setAttribute('aria-pressed',b.dataset.p===p?'true':'false')});
  $$('[data-page]',app).forEach(function(b){b.addEventListener('click',function(){nav(b.dataset.page)})});
  initCommon(app);if(p==='ch')initDemo(app);if(T.init)T.init(app,p);swh();scrollTo(0,0);
}
function nav(p){var h='#'+p;if(location.hash!==h){try{history.replaceState(null,'',h)}catch(e){}}show(p)}
pBtns.forEach(function(b){b.addEventListener('click',function(){nav(b.dataset.p)})});
function swh(){document.documentElement.style.setProperty('--swh',$('.sw').offsetHeight+'px')}
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){swh();if(CUR.lock)CUR.lock()},200)});
show(location.hash==='#ch'?'ch':'home');

})();
